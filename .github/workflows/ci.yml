name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TaskManagement.sln
      - run: dotnet build api/TaskManagement.Api.csproj --configuration Release --no-restore
      - run: dotnet test tests/TaskManagement.Tests.csproj --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: corepack enable
      - run: corepack prepare pnpm@9.7.1 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - run: pnpm run api:generate
        working-directory: client
      - run: pnpm test
        working-directory: client
      - run: pnpm run build
        working-directory: client

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m json.tool docs/swagger.json >/tmp/task-management-swagger.json
